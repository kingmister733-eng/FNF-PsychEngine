name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  buildAndroid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: 25.2.9519653

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      - name: Install Haxelib Libraries
        run: |
          haxelib setup ~/haxelib

          # Устанавливаем исправленный hxcpp 4.3.45 напрямую от разработчиков Haxe
          curl -sL https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.45/hxcpp-4.3.45.zip -o hxcpp-4.3.45.zip
          haxelib install hxcpp-4.3.45.zip --always --quiet

          haxelib install lime 8.1.2 --always --quiet
          haxelib install openfl 9.3.3 --always --quiet
          haxelib set lime 8.1.2
          haxelib set openfl 9.3.3
          haxelib install flixel 5.6.1 --always --quiet
          haxelib install flixel-addons 3.2.2 --always --quiet
          haxelib install flixel-ui 2.6.1 --always --quiet
          haxelib set flixel 5.6.1
          haxelib set flixel-addons 3.2.2
          haxelib set flixel-ui 2.6.1
          haxelib install hscript-iris 1.1.0 --always --quiet
          haxelib install tjson 1.4.0 --always --quiet
          haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate 768740a56b26aa0c072720e0d1236b94afe68e3e --quiet

      - name: Configure Lime for Android
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $NDK_PATH
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

          mkdir -p ~/.lime
          cat <<EOF > ~/.lime/config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <config>
            <set name="ANDROID_SETUP" value="true" />
            <set name="ANDROID_SDK" value="$ANDROID_HOME" />
            <set name="ANDROID_NDK_ROOT" value="$NDK_PATH" />
            <set name="JAVA_HOME" value="$JAVA_HOME" />
          </config>
          EOF

      - name: Compile APK
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          haxelib run lime build android -final

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Engine-Android-Release
          path: export/**/*.apk